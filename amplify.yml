version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Node.js 25+ Linux binaries need libatomic before Node or npm can run.
        - sudo dnf install -y libatomic
        - node --version
        - npm ci
    build:
      commands:
        - npm run lint
        - npm test
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
