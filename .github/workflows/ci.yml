name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          pip install poetry
          poetry install --with dev

      - name: Lint (black)
        run: poetry run black --check .

      - name: Lint (isort)
        run: poetry run isort --check .

      - name: Test with coverage
        run: poetry run pytest --cov=route2gpx --cov-report=term-missing tests/test_route2gpx.py

  javascript:
    name: JavaScript tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.22.2", "24.15.0", "26.12.0"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run lint && npm run test:coverage

      - name: Verify build
        run: npm run build

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Browser regression tests
        run: npm run test:browser

      - name: Save browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-failures-node-${{ matrix.node }}
          path: test-results/
          retention-days: 7

  terraform:
    name: Terraform validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v7

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.5"

      - name: Terraform fmt
        run: terraform fmt -check

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate
