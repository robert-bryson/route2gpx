customHeaders:
  - pattern: '**'
    headers:
      - key: X-Content-Type-Options
        value: nosniff
      - key: X-Frame-Options
        value: DENY
      - key: Referrer-Policy
        value: strict-origin-when-cross-origin
      - key: Cache-Control
        value: no-cache
      - key: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
      - key: Permissions-Policy
        value: geolocation=(self), camera=(), microphone=()
      - key: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' https://cloud.umami.is; style-src 'self'; img-src 'self' data: https://*.basemaps.cartocdn.com; connect-src 'self' https://routes.googleapis.com https://maps.googleapis.com https://gateway.umami.is; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"
  - pattern: '*.js'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: '*.css'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
  - pattern: 'vendor/**'
    headers:
      - key: Cache-Control
        value: public, max-age=31536000, immutable
